# =========================================================================
# 1. ServiceAccount: 파드에게 AWS 자원(S3, SES 등)에 접근할 신분증을 발급합니다.
# =========================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coupang-eats-nestjs-sa
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::441866789243:role/coupang-eats-dev-nestjs-pod-role"
---
# =========================================================================
# 2. Deployment: NestJS 컨테이너 파드들을 관리하고 무중단 배포를 제어합니다.
# =========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coupang-eats-nestjs-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: coupang-eats-nestjs
  template:
    metadata:
      labels:
        app: coupang-eats-nestjs
    spec:
      serviceAccountName: coupang-eats-nestjs-sa
      containers:
        - name: nestjs-app
          image: 441866789243.dkr.ecr.ap-northeast-2.amazonaws.com/coupang-eats-dev-repo:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          
          # 🔥 NestJS 소스코드가 어떤 환경변수 명칭을 요구하든 통과하도록 이중 매핑 가동
          env:
            - name: NODE_ENV
              value: "production"

            # [A] 데이터베이스 주소 및 포트 동기화
            - name: DATABASE_HOST
              value: "coupang-eats-dev-aurora-cluster.cluster-c56484cqmwo2.ap-northeast-2.rds.amazonaws.com"
            - name: DB_HOST
              value: "coupang-eats-dev-aurora-cluster.cluster-c56484cqmwo2.ap-northeast-2.rds.amazonaws.com"
            - name: DATABASE_PORT
              value: "3306"
            - name: DB_PORT
              value: "3306"

            # [B] 데이터베이스 인증 정보 (undefined 탈출 핵심 구역)
            - name: DB_USERNAME
              value: "user0"
            - name: DATABASE_USER
              value: "user0"
            - name: DB_PASSWORD
              value: "실제_테라폼에_설정한_DB_비밀번호를_여기에_입력" # 👈 여기만 실제 암호로 변경해 주세요!
            - name: DATABASE_PASSWORD
              value: "실제_테라폼에_설정한_DB_비밀번호를_여기에_입력" # 👈 여기만 실제 암호로 변경해 주세요!
            - name: DB_NAME
              value: "coupang_eats"
            - name: DATABASE_NAME
              value: "coupang_eats"

            # [C] Redis 캐시 정보 동기화
            - name: REDIS_HOST
              value: "master.coupang-eats-dev-redis.vzfwhp.apn2.cache.amazonaws.com"
            - name: REDIS_PORT
              value: "6379"
---
# =========================================================================
# 3. Service: 외부 인터넷에서 접속할 수 있는 공인 로드밸런서 문을 개통합니다.
# =========================================================================
apiVersion: v1
kind: Service
metadata:
  name: coupang-eats-nestjs-service
  namespace: default
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app: coupang-eats-nestjs