# =========================================================================
# 1. ServiceAccount: 파드에게 AWS 자원(S3, SES 등)에 접근할 신분증을 발급합니다.
# =========================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coupang-eats-nestjs-sa
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::441866789243:role/coupang-eats-dev-nestjs-pod-role"
---
# =========================================================================
# 2. Deployment: NestJS 컨테이너 파드들을 관리하고 무중단 배포를 제어합니다.
# =========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coupang-eats-nestjs-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: coupang-eats-nestjs
  template:
    metadata:
      labels:
        app: coupang-eats-nestjs
    spec:
      serviceAccountName: coupang-eats-nestjs-sa
      containers:
        - name: nestjs-app
          image: 441866789243.dkr.ecr.ap-northeast-2.amazonaws.com/coupang-eats-dev-repo:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          
          # 🔥 소스코드가 어떤 변수명 조합을 요구하든 무조건 걸려들게 만드는 환경변수 백화점
          env:
            - name: NODE_ENV
              value: "production"

            # [A] 데이터베이스 주소 및 포트 동기화 (검증 완료)
            - name: DATABASE_HOST
              value: "coupang-eats-dev-aurora-cluster.cluster-c56484cqmwo2.ap-northeast-2.rds.amazonaws.com"
            - name: DB_HOST
              value: "coupang-eats-dev-aurora-cluster.cluster-c56484cqmwo2.ap-northeast-2.rds.amazonaws.com"
            - name: DATABASE_PORT
              value: "3306"
            - name: DB_PORT
              value: "3306"

            # [B] 데이터베이스 인증 유저명 (🎯 범인 체포 완료: DB_USER_NAME 추가)
            - name: DB_USER_NAME
              value: "user0"
            - name: DATABASE_USER_NAME
              value: "user0"
            - name: DB_USER
              value: "user0"
            - name: DB_USERNAME
              value: "user0"
            - name: DATABASE_USER
              value: "user0"
            - name: DATABASE_USERNAME
              value: "user0"

            # ⚠️ 아래 두 곳에 실제 테라폼 DB 마스터 암호를 입력하세요!
            - name: DB_PASSWORD
              value: "실제_비밀번호_입력" 
            - name: DATABASE_PASSWORD
              value: "실제_비밀번호_입력" 

            # [C] 데이터베이스 스키마 이름 매핑
            - name: DB_NAME
              value: "coupang_eats"
            - name: DATABASE_NAME
              value: "coupang_eats"
            - name: DB_DATABASE
              value: "coupang_eats"

            # [D] Redis 캐시 정보 동기화
            - name: REDIS_HOST
              value: "master.coupang-eats-dev-redis.vzfwhp.apn2.cache.amazonaws.com"
            - name: REDIS_PORT
              value: "6379"
---
# =========================================================================
# 3. Service: 외부 인터넷에서 접속할 수 있는 공인 로드밸런서 문을 개통합니다.
# =========================================================================
apiVersion: v1
kind: Service
metadata:
  name: coupang-eats-nestjs-service
  namespace: default
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app: coupang-eats-nestjs