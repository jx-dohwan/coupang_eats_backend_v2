name: Deploy to Amazon EKS (Terraform Managed)

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: ap-northeast-2
  # 💡 [동기화] 현재 실제 AWS 계정 ID와 테라폼 리포지토리 명칭 완벽 동기화
  AWS_ACCOUNT_ID: "441866789243"
  ECR_REPOSITORY: coupang-eats-dev-repo 
  EKS_CLUSTER: coupang-eats-dev-cluster

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 💡 [수정] 이전 테스트 계정에서 현재 마스터 계정 ID(441866789243) 및 새 EKS 배포 Role 이름 매핑
          role-to-assume: arn:aws:iam::441866789243:role/github-actions-eks-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest 
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # ⭐ [EKS 이주 핵심 1] 깃허브 러너에 쿠버네티스 제어 도구(kubectl) 설치
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'

      # ⭐ [EKS 이주 핵심 2] AWS 인증을 거쳐 EKS 클러스터 접속 자격 증명(kubeconfig) 갱신
      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      # ⭐ [EKS 이주 핵심 3] 쿠버네티스 명세서 반영 및 latest 이미지 강제 무중단 교체(Rollout)
      - name: Deploy to EKS & Rolling Update
        run: |
          kubectl apply -f k8s/nestjs-app.yaml
          kubectl rollout restart deployment/coupang-eats-nestjs-deployment

